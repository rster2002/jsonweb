[package]
name = "jsonweb"
version = "1.0.1"
edition = "2024"

[dependencies]
base64 = "0.22.1"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
thiserror = "2.0.11"
hmac = { version = "0.13.0", optional = true }
digest = "0.11.0"
sha2 = { version = "0.11.0", features = ["oid"], optional = true }
rsa = { version = "0.10.0", optional = true, features = ["pkcs1v15"] }
pkcs1 = { version = "0.7.5", optional = true }
p256 = { version = "0.14.0", features = ["pem", "arithmetic"], optional = true }
p384 = { version = "0.14.0", optional = true }
chrono = "0.4.39"
ecdsa = "0.17.0"
rand = { version = "0.8.0", optional = true }
bon = "3.10.3"
const-oid = "0.10.2"

[features]
default = ["hs256"]
pkcs1 = ["dep:pkcs1"]
rand = ["dep:rand"]

hmac = ["hs256", "hs384", "hs512"]
hs256 = ["dep:hmac", "dep:sha2"]
hs384 = ["dep:hmac", "dep:sha2"]
hs512 = ["dep:hmac", "dep:sha2"]

rsassa-pkcs1-v1_5 = ["rs256", "rs384", "rs512"]
rs256 = ["dep:rsa", "dep:sha2"]
rs384 = ["dep:rsa", "dep:sha2"]
rs512 = ["dep:rsa", "dep:sha2"]

ecdsa = ["es256", "es384"]
es256 = ["dep:p256"]
es384 = ["dep:p384"]
